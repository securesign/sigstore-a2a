name: Release

on:
  # Tag-triggered releases are handled by rh-release.yml for the downstream
  # rh-sigstore-a2a package. This upstream workflow is retained for manual use only.
  #
  # push:
  #   tags:
  #     - "v[0-9]+.[0-9]+.[0-9]+"
  #     - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build and publish (e.g. v1.0.1)"
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false

      - name: Extract version from tag
        id: version
        run: |
          tag="${{ steps.ref.outputs.ref }}"
          version="${tag#refs/tags/v}"
          version="${version#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Verify version consistency
        run: |
          tag_version="${{ steps.version.outputs.version }}"
          pkg_version=$(python -c "
          import re
          with open('sigstore_a2a/__init__.py') as f:
              match = re.search(r'__version__\s*=\s*\"([^\"]+)\"', f.read())
              print(match.group(1))
          ")
          if [ "${tag_version}" != "${pkg_version}" ]; then
            echo "::error::Tag version (${tag_version}) does not match package version (${pkg_version})"
            exit 1
          fi

      - name: Set up Hatch
        uses: pypa/hatch@f647ed70d49adb885f53a27d1c7f5bdaeacf2c60 # install branch

      - name: Build artifacts
        run: hatch build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 5

  # NOTE: PyPI publishing for the downstream rh-sigstore-a2a package is handled
  # by rh-release.yml. This job is disabled to prevent accidental publishing
  # to the upstream sigstore-a2a PyPI project from the downstream fork.
  #
  # publish:
  #   name: Publish to PyPI
  #   needs: [build]
  #   ...

  create_github_release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          files: |
            dist/*
          generate_release_notes: true

  build_and_push_container:
    name: Build and Push Docker Image
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        id: build_image
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          containerfiles: |
            ./Containerfile
          image: sigstore/sigstore-a2a
          tags: "latest ${{ github.ref_name }}"
          archs: amd64
          oci: false
      - name: Push image to GHCR
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        id: push
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          registry: ghcr.io
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/sigstore/sigstore-a2a
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
