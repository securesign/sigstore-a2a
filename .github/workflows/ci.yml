name: Core

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Install UV
        uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7.2.1
        with:
          version: "0.12.19"

      - name: Cache UV dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: make install-dev

      - name: Run tests
        run: make test

  sign-agent-card:
    name: Sign Agent Card
    runs-on: ubuntu-latest
    needs: [test]
    # Signing uses an explicitly fetched staging token and must never run for
    # untrusted pull request code.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Install UV
        uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7.2.1
        with:
          version: "0.12.19"

      - name: Cache UV dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: make install

      - name: Sign Agent Cards
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          sigstore_id_token=$(curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            https://storage.googleapis.com/sigstore-conformance-testing-token/untrusted-testing-token.txt)
          if [[ ! "$sigstore_id_token" =~ ^[^[:space:]]+\.[^[:space:]]+\.[^[:space:]]+$ ]]; then
            echo "::error::The staging identity token is not a JWT"
            exit 1
          fi

          uv run sigstore-a2a sign \
            --staging \
            --output signed-georoute-agent.json \
            --repository "$REPOSITORY" \
            --provenance \
            --identity_token "$sigstore_id_token" \
            examples/georoute-agent.json

          uv run sigstore-a2a sign \
            --staging \
            --output signed-data-analysis-agent.json \
            --repository "$REPOSITORY" \
            --provenance \
            --identity_token "$sigstore_id_token" \
            examples/data-analysis-agent.json

      - name: Verify GeoRoute Agent Card
        run: |
          uv run sigstore-a2a --verbose verify \
            --staging \
            --identity "untrusted-sa@sigstore-conformance.iam.gserviceaccount.com" \
            --identity_provider "https://accounts.google.com" \
            signed-georoute-agent.json

      - name: Verify Data Analysis Agent Card
        run: |
          uv run sigstore-a2a --verbose verify \
            --staging \
            --identity "untrusted-sa@sigstore-conformance.iam.gserviceaccount.com" \
            --identity_provider "https://accounts.google.com" \
            signed-data-analysis-agent.json

      - name: Upload signed Agent Cards
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-agent-cards
          path: |
            signed-georoute-agent.json
            signed-data-analysis-agent.json
          retention-days: 30
